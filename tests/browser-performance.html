<!doctype html><meta charset="utf-8"><title>Upscale runtime check</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f7f8f5;color:#222}button{padding:14px 22px;background:#222;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap}</style>
<h1>Upscale runtime check</h1><p>Runs a small synthetic image locally. No files are uploaded.</p>
<button id="run">Check acceleration</button><pre id="result" role="status">Ready.</pre>
<script>
const button=document.querySelector('#run'),output=document.querySelector('#result');
button.onclick=async()=>{button.disabled=true;let id=0;const waiting=new Map(),worker=new Worker(new URL('../illustration-worker.js?v=4',location.href));worker.onmessage=({data})=>{const task=waiting.get(data.id);waiting.delete(data.id);if(data.error)task.reject(Error(data.error));else task.resolve(data)};worker.onerror=event=>{for(const task of waiting.values())task.reject(Error(event.message));waiting.clear()};const send=message=>new Promise((resolve,reject)=>{message.id=++id;waiting.set(id,{resolve,reject});worker.postMessage(message)});try{output.textContent='Loading model…';const init=await send({type:'init',cpuOnly:false});output.textContent='Provider: '+init.provider+'\nRunning…';const side=32,rgba=new Uint8ClampedArray(side*side*4);for(let i=0;i<rgba.length;i+=4){rgba[i]=150;rgba[i+1]=60;rgba[i+2]=200;rgba[i+3]=255}const times=[];for(let test=0;test<2;test++){const started=performance.now();const result=await send({type:'tile',side,padding:8,core:16,factor:4,rgba});if(result.pixels.length!==64*64*4)throw Error('Incorrect output dimensions');times.push(Math.round(performance.now()-started))}output.textContent='Provider: '+init.provider+'\nInference: '+times.join(' / ')+' ms\nPASS: actual browser worker, model inference and output dimensions.'}catch(error){output.textContent='FAIL: '+error.message}finally{worker.terminate();button.disabled=false}};
</script>
