          from pathlib import Path
          from zipfile import ZipFile
          import subprocess
          expected = ['.gitignore', 'README.md', 'app.js', 'cs/index.html', 'cs/manifest.webmanifest', 'icons/apple-touch-icon.png', 'icons/icon-192.png', 'icons/icon-512.png', 'icons/icon-maskable-512.png', 'illustration-worker.js', 'index.html', 'manifest.webmanifest', 'models/photo/model.onnx.sha256', 'scripts/build-site.sh', 'scripts/test-site.sh', 'sw.js', 'tests/browser-e2e.cjs', 'tests/browser-runtime.cjs', 'tools/convert-realesr-general.py', 'tools/pth.py']
          with ZipFile('/tmp/upscale-features-files.zip') as archive:
              files = sorted(i.filename for i in archive.infolist() if not i.is_dir() and not i.filename.startswith('.github/workflows/'))
              assert files == expected
              for name in files:
                  target = Path(name)
                  assert not target.is_absolute() and '..' not in target.parts
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          for name in ['scripts/build-site.sh', 'scripts/test-site.sh']:
              Path(name).chmod(0o755)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          changed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          print('Verified and staged all 20 non-workflow feature files, including binary PNGs')
