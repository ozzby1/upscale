name: Publish Upscale
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static files and local AI models
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @tensorflow/tfjs@4.11.0 @tensorflow/tfjs-backend-wasm@4.11.0 @upscalerjs/esrgan-slim@1.0.0 onnxruntime-web@1.30.0
          mkdir -p _site/cs _site/tests _site/vendor/ort _site/models/x2 _site/models/x4 _site/models/illustration _site/models/illustration-quick
          cp index.html _site/index.html
          cp cs/index.html _site/cs/index.html
          cp node_modules/@tensorflow/tfjs/dist/tf.min.js _site/vendor/
          cp node_modules/@tensorflow/tfjs-backend-wasm/dist/tf-backend-wasm.min.js _site/vendor/
          cp node_modules/@tensorflow/tfjs-backend-wasm/dist/*.wasm _site/vendor/
          cp node_modules/@upscalerjs/esrgan-slim/models/x2/* _site/models/x2/
          cp node_modules/@upscalerjs/esrgan-slim/models/x4/* _site/models/x4/
          cp node_modules/@upscalerjs/esrgan-slim/LICENSE _site/models/LICENSE-esrgan.txt
          curl -fsSL https://raw.githubusercontent.com/tensorflow/tfjs/tfjs-v4.11.0/LICENSE -o _site/vendor/LICENSE-tensorflow.txt
          cp illustration-worker.js _site/
          cp tests/browser-performance.html _site/tests/
          cp node_modules/onnxruntime-web/dist/ort.{webgpu,wasm}.min.js _site/vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded{,.asyncify}.{mjs,wasm} _site/vendor/ort/
          curl --retry 3 -fsSL https://raw.githubusercontent.com/microsoft/onnxruntime/v1.30.0/LICENSE -o _site/vendor/ort/LICENSE-onnxruntime.txt
          curl --retry 3 -fsSL https://huggingface.co/skillsafe-ai/realesrgan-x4plus-anime-6b/resolve/c001be50fae1c7a2bae8b2b4dec5e6fcbdbcca96/model.onnx -o _site/models/illustration/model.onnx
          echo "9a029dae374b2cd4c3eb2dbbed857e22e6d785687c767aa12828e7356b9fb378  _site/models/illustration/model.onnx" | sha256sum --check
          curl --retry 3 -fsSL https://raw.githubusercontent.com/xinntao/Real-ESRGAN/v0.3.0/LICENSE -o _site/models/illustration/LICENSE-Real-ESRGAN.txt
          curl --retry 3 -fsSL https://huggingface.co/skillsafe-ai/realesr-animevideov3/resolve/185e9142d439d17e3fb99395600fb7d08af09de5/model.onnx -o _site/models/illustration-quick/model.onnx
          echo "78baa685a1a92cac6e14ab2af2a8ad0ef56fa48629563b1414e3a7acc54d86e2  _site/models/illustration-quick/model.onnx" | sha256sum --check
          cp _site/models/illustration/LICENSE-Real-ESRGAN.txt _site/models/illustration-quick/LICENSE-Real-ESRGAN.txt
          node tests/browser-runtime.cjs _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
